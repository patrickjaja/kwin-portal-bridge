[package]
name = "kwin-portal-bridge"
version = "0.2.9"
edition = "2024"

[dependencies]
cu-atspi = { git = "https://github.com/patrickjaja/cu-atspi", rev = "30ff9c84332569aadb4b83364cfdc89fa7ca6a04", features = ["clap"] }
# Shared runner for the `abort-watch` subcommand, pinned by rev like cu-atspi.
cu-abort-watch = { git = "https://github.com/patrickjaja/cu-abort-watch", rev = "c8be7212b6e40e582aebc6023d69d20bbedf79dc" }
# Shared layer-shell renderer for the `overlay` subcommand (glow and drawn cursor).
cu-overlay = { git = "https://github.com/patrickjaja/cu-overlay", rev = "e1f1a9127888fefc2a930d6fc64330e474d8af89" }
anyhow = "1.0.103"
ashpd = "0.13.12"
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive", "std", "help", "suggestions"], default-features = false }
dbus = { version = "0.9.12", features = ["vendored"], default-features = false }
freedesktop-desktop-entry = { version = "0.8.1", default-features = false }
freedesktop-icons = { version = "0.4.0", default-features = false }
iced = { version = "0.14.0", features = ["canvas", "tokio", "wayland", "web-colors", "wgpu"], default-features = false }
iced_layershell = { version = "0.19.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lamco-portal = { version = "0.4.2", default-features = false}
lamco-pipewire = { version = "0.6.3", default-features = false}
libc = { version = "0.2.186", default-features = false, features = ["std"]}
serde = { version = "1.0.228" , default-features = false}
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
schemars = { version = "1.2.1", default-features = false, optional = true }
tempfile = { version = "3.27.0", default-features = false}
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] , default-features = false}
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] , default-features = false}
# doctor's registry probe for the overlay capabilities (already in the tree
# through cu-overlay and iced).
wayland-client = { version = "0.31.14", default-features = false }
wl-clipboard-rs = { version = "0.9.3", default-features = false}
rmcp = { version = "2.2.0", features = ["schemars", "transport-io", "server", "macros"] , default-features = false, optional = true }

[features]
default = []
mcp = ["dep:rmcp", "dep:schemars"]

[profile.release]
strip = true
opt-level = 3